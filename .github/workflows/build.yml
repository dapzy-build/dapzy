name: Flutter to apk

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      zip_name:
        description: 'Nama ZIP atau URL ZIP di repo'
        required: true
      build_mode:
        description: 'release / debug'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & extract ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip
          mkdir -p project_raw
          SRC="${{ github.event.inputs.zip_name }}"

          if [[ "$SRC" == http* ]]; then
            curl -fL --retry 3 --retry-delay 5 -o project.zip "$SRC"
          else
            if [ ! -f "$SRC" ]; then
              curl -fL --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github.raw" \
                -o project.zip \
                "https://api.github.com/repos/${{ github.repository }}/contents/${SRC}"
            else
              cp "$SRC" project.zip
            fi
          fi

          ls -lh project.zip
          unzip -q project.zip -d project_raw

          if [ ! -f project_raw/pubspec.yaml ]; then
            SUB=$(find project_raw -maxdepth 2 -name pubspec.yaml -printf '%h\n' | head -1 || true)
            if [ -n "$SUB" ]; then
              mv "$SUB"/* project_raw/ 2>/dev/null || true
              mv "$SUB"/.* project_raw/ 2>/dev/null || true
            fi
          fi

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          PUBSPEC=$(find project_raw -type f -name pubspec.yaml \
                    -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -n 1)
          GRADLEW=$(find project_raw -type f -name gradlew \
                    -not -path "*/build/*" | head -n 1)
          SETTINGS=$(find project_raw -type f \
                    \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                    -not -path "*/build/*" | head -n 1)

          echo "pubspec : ${PUBSPEC:-<none>}"
          echo "gradlew : ${GRADLEW:-<none>}"
          echo "settings: ${SETTINGS:-<none>}"

          if [ -n "$PUBSPEC" ]; then
            DIR=$(dirname "$PUBSPEC")
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Flutter project → $DIR"
          elif [ -n "$GRADLEW" ]; then
            DIR=$(dirname "$GRADLEW")
            echo "type=gradle"  >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Native Gradle project → $DIR"
          elif [ -n "$SETTINGS" ]; then
            DIR=$(dirname "$SETTINGS")
            echo "type=gradle"  >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Gradle project → $DIR"
          else
            echo "::error::Project tidak dikenali."
            find project_raw -maxdepth 3
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project_raw/**/*.gradle*', 'project_raw/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter Pub Get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter pub get

      - name: Build APK (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_mode }}"
          [ -z "$BT" ] && BT=release
          if [ "$BT" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build APK (Native)
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          BT="${{ github.event.inputs.build_mode }}"
          [ -z "$BT" ] && BT=release
          if [ "$BT" = "debug" ]; then TASK="assembleDebug"; else TASK="assembleRelease"; fi
          if [ -f gradlew ]; then chmod +x gradlew; CMD="./gradlew"; else CMD="gradle"; fi
          echo "Running: $CMD $TASK"
          $CMD "$TASK" --parallel --build-cache 2>&1 | tee build.log

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=""
          APK=$(find project_raw -type f -name "*.apk" \
                -not -path "*/intermediates/*" \
                -not -path "*/tmp/*" \
                -not -path "*/kotlin/*" \
                -not -path "*/.gradle/*" \
                2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find project_raw -type f -name "*.apk" -not -path "*/.gradle/*" | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            find / -type f -name "*.apk" 2>/dev/null | grep -v "/proc/" | head -20 || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          if [ "$APK_SIZE" -lt 1000 ]; then
            echo "::error::APK corrupt ($APK_SIZE bytes)."
            exit 1
          fi
          echo "✅ APK: $APK ($APK_SIZE bytes)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
